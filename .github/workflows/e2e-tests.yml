name: Playwright E2E & API Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * *' # Executa diariamente às 08:00 UTC
  workflow_dispatch: # Permite disparar manualmente na aba Actions do GitHub

jobs:
  test:
    name: Run Automated E2E & API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright Automated Tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: 'https://economize-ja-production.up.railway.app'
          API_BASE_URL: 'https://api-production-4879.up.railway.app'

      - name: Generate GitHub Job Summary Markdown Report
        if: always()
        run: |
          echo "## 📊 Resumo da Execução de Testes Automatizados - Economize Já" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Suite** | ${{ job.status == 'success' && '✅ APROVADO' || '❌ FALHOU' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente Web** | https://economize-ja-production.up.railway.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente API** | https://api-production-4879.up.railway.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Executor** | GitHub Actions (${{ github.actor }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artefatos Disponíveis" >> $GITHUB_STEP_SUMMARY
          echo "Os relatórios visuais HTML, screenshots e gravações de vídeo das falhas foram salvos como artefatos abaixo." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results & Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-videos-screenshots
          path: test-results/
          retention-days: 14
